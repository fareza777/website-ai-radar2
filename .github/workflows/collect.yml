name: Collect AI intelligence
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'Backfill window (1–365 days)'
        default: '90'
        required: false
permissions:
  contents: write
concurrency:
  group: radar-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '90' }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MAX_ITEMS: '8'
      - run: npm run data:validate
      - name: Persist data history
        run: |
          git config user.name 'AI Radar Collector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/radar.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified AI intelligence and source coverage'
            git push origin HEAD:main
          fi
      - name: Trigger Vercel production rebuild when configured
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --request POST "$DEPLOY_HOOK" > /dev/null
          fi
