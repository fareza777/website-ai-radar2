name: Verify AI Radar
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run data:validate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start production build and run browser checks
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/radar-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000 > /dev/null
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 7
